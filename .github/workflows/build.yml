# Testa e compila o editor no Windows a cada push e pull request. Uma tag vX.Y.Z publica o
# release com o exe e o trecho do CHANGELOG.md daquela versão.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # a tag tem de bater com a versão do exe, senão o release sai com o número errado
      - name: Confere a versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_v=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          tauri_v=$(grep -m1 '"version"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "tag $tag, Cargo.toml $cargo_v, tauri.conf.json $tauri_v"
          [ "$tag" = "$cargo_v" ] && [ "$tag" = "$tauri_v" ]

      # formato do save, dados do jogo e, no Edge sem janela, os testes da interface
      - name: Testes
        working-directory: src-tauri
        run: cargo test --locked

      - name: Compila
        working-directory: src-tauri
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: enshrouded-save-editor
          path: src-tauri/target/release/enshrouded-save-editor.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: enshrouded-save-editor

      # notas do release: a seção "## X.Y.Z" do CHANGELOG.md, até a próxima versão
      - name: Publica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versao="${GITHUB_REF_NAME#v}"
          awk -v v="$versao" '/^## / { dentro = index($0, "## " v " ") == 1 || $0 == "## " v; next } dentro' CHANGELOG.md > notas.md
          [ -s notas.md ] || echo "Versão $versao." > notas.md
          gh release create "$GITHUB_REF_NAME" enshrouded-save-editor.exe \
            --title "$GITHUB_REF_NAME" --notes-file notas.md --verify-tag
